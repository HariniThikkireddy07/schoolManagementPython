<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Courses - EduManage</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        🏫 EduManage
    </div>

    <nav>
        <a href="/">Dashboard</a>
        <a href="/students">Students</a>
        <a href="/teachers">Teachers</a>
        <a href="/courses">Courses</a>
        <a href="/contact">Contact</a>
    </nav>

</header>


<section class="page">

    <h1>Courses</h1>

    <p class="subtitle">
        Academic courses offered by our school.
    </p>


    <div class="course-grid">

        {% for course in courses %}

        <div class="course-card">

            <h2>📚 {{ course.name }}</h2>

            <p>
                {{ course.description }}
            </p>

            <div class="course-students">
                👨‍🎓 {{ course.students }} Students
            </div>

        </div>

        {% endfor %}

    </div>

</section>


<footer>

    <p>© 2026 EduManage School Management System</p>

</footer>

</body>
</html>
